name: AI Laya Decision Intelligence Development

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  focused-python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.14"
      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements-runtime.lock.txt
          python -m pip install -r requirements-dashboard.in
          python -m pip install -r requirements-test.in
      - name: AI/Laya focused Python tests
        shell: pwsh
        run: |
          $tests = Get-ChildItem tests_v1/test_ai_*.py | ForEach-Object { $_.FullName }
          if (-not $tests) { throw "No AI tests found" }
          python -m pytest $tests -q
