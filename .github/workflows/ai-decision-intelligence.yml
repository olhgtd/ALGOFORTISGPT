name: AI Laya Decision Intelligence Qualification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  QUALIFIED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  PYTHONPATH: ${{ github.workspace }}

jobs:
  focused-windows:
    name: Decision Intelligence deterministic / ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.QUALIFIED_HEAD }}
      - name: Assert exact implementation head
        shell: pwsh
        run: |
          $actual = git rev-parse HEAD
          if ($actual -ne $env:QUALIFIED_HEAD) { throw "Expected $env:QUALIFIED_HEAD but checked out $actual" }
          Write-Host "AI_INTELLIGENCE_TESTED_HEAD=$actual"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.14"
      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements-runtime.lock.txt
          python -m pip install -r requirements-dashboard.in
          python -m pip install -r requirements-test.in
      - name: Focused AI/Laya and Owner control tests
        shell: pwsh
        run: |
          $tests = Get-ChildItem tests_v1/test_ai_*.py | ForEach-Object { $_.FullName }
          if (-not $tests) { throw "No AI tests found" }
          python -m pytest $tests tests_v1/test_owner_admin_decision_intelligence.py -q
      - name: Authority boundary guards
        shell: pwsh
        run: |
          python build/tools/check_ai_decision_intelligence_boundary.py
          python build/tools/check_phase8_ai_shadow.py
          python build/tools/check_phase7_portfolio_risk.py
          python build/tools/check_s2_account_gate.py
          python build/tools/check_owner_admin_boundary.py
      - name: Deterministic qualification evidence
        shell: pwsh
        run: |
          "AI_INTELLIGENCE_TESTED_HEAD=$env:QUALIFIED_HEAD" | Set-Content -Encoding utf8 ai-intelligence.txt
          python build/tools/ai_decision_intelligence_probe.py | Add-Content -Encoding utf8 ai-intelligence.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ai-intelligence-${{ matrix.os }}
          path: ai-intelligence.txt

  full-stack:
    name: Decision Intelligence full repository preservation / Windows latest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.QUALIFIED_HEAD }}
      - name: Assert exact implementation head
        shell: pwsh
        run: |
          $actual = git rev-parse HEAD
          if ($actual -ne $env:QUALIFIED_HEAD) { throw "Expected $env:QUALIFIED_HEAD but checked out $actual" }
          Write-Host "AI_INTELLIGENCE_FULL_STACK_HEAD=$actual"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.14"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements-runtime.lock.txt
          python -m pip install -r requirements-dashboard.in
          python -m pip install -r requirements-test.in
      - name: Compile complete Python source tree
        run: python -m compileall -q engine dashboard build tests_v1 strategies
      - name: Preserve all static and safety gates
        shell: pwsh
        run: |
          $guards = @(
            'build/tools/check_module_boundaries.py',
            'build/tools/check_phase1_foundation.py',
            'build/tools/check_phase2_safety_spine.py',
            'build/tools/check_phase3_data_v2.py',
            'build/tools/check_phase4_research_backtest.py',
            'build/tools/check_phase5_paper_recovery.py',
            'build/tools/check_phase6_live_readonly.py',
            'build/tools/check_phase7_portfolio_risk.py',
            'build/tools/check_phase8_ai_shadow.py',
            'build/tools/check_phase9_product_ops.py',
            'build/tools/check_live_reunion_boundary.py',
            'build/tools/check_riskgate_fast_path_boundary.py',
            'build/tools/check_owner_admin_boundary.py',
            'build/tools/check_s2_account_gate.py',
            'build/tools/check_ai_decision_intelligence_boundary.py'
          )
          foreach ($guard in $guards) {
            Write-Host "=== $guard ==="
            python $guard
            if ($LASTEXITCODE -ne 0) { throw "$guard failed with exit code $LASTEXITCODE" }
          }
      - name: Full Python regression
        run: python -m pytest tests_v1 -q
      - name: Existing regression certification
        run: python build/tools/run_regression_certification.py
      - name: Decision Intelligence deterministic probe
        run: python build/tools/ai_decision_intelligence_probe.py
      - name: Preserve deterministic phase probes
        shell: pwsh
        run: |
          $probes = @(
            'build/tools/phase4_probe.py',
            'build/tools/phase5_probe.py',
            'build/tools/phase6_probe.py',
            'build/tools/phase7_probe.py',
            'build/tools/phase8_ai_probe.py',
            'build/tools/phase9_product_ops_probe.py',
            'build/tools/s2_deterministic_probe.py'
          )
          foreach ($probe in $probes) {
            Write-Host "=== $probe ==="
            python $probe
            if ($LASTEXITCODE -ne 0) { throw "$probe failed with exit code $LASTEXITCODE" }
          }
      - name: Install root Node package
        run: npm ci
      - name: Root dependency security audit
        run: npm audit --audit-level=high
      - name: Install dashboard package
        run: npm ci --prefix dashboard/web
      - name: Dashboard dependency security audit
        run: npm audit --prefix dashboard/web --audit-level=high
      - name: Dashboard tests including Owner Decision Intelligence
        run: npm --prefix dashboard/web run test:user-dashboard
      - name: Dashboard typecheck
        run: npm run typecheck
      - name: Dashboard production build
        run: npm run build

  compare:
    name: Decision Intelligence exact cross-Windows evidence compare
    runs-on: ubuntu-latest
    needs: [focused-windows, full-stack]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ai-intelligence-windows-latest
          path: latest
      - uses: actions/download-artifact@v4
        with:
          name: ai-intelligence-windows-2022
          path: win2022
      - name: Require identical exact-head evidence
        shell: bash
        run: |
          diff <(tr -d '\r' < latest/ai-intelligence.txt) <(tr -d '\r' < win2022/ai-intelligence.txt)
          grep -F "AI_INTELLIGENCE_TESTED_HEAD=$QUALIFIED_HEAD" latest/ai-intelligence.txt
          grep -F "AI_INTELLIGENCE_STRATEGY_INDEPENDENCE=PASS" latest/ai-intelligence.txt
          grep -F "AI_INTELLIGENCE_ZERO_TO_N=PASS" latest/ai-intelligence.txt
          grep -F "AI_INTELLIGENCE_RISKGATE_AUTHORITY=PASS" latest/ai-intelligence.txt
          grep -F "AI_INTELLIGENCE_MULTI_BROKER_RESERVATION=PASS" latest/ai-intelligence.txt
          grep -F "AI_INTELLIGENCE_OD16_EGRESS=PASS" latest/ai-intelligence.txt
          grep -F "AI_INTELLIGENCE_S2_ENTITLEMENTS=PASS" latest/ai-intelligence.txt
          grep -F "AI_INTELLIGENCE_OWNER_DASHBOARD=PASS" latest/ai-intelligence.txt
          grep -F "LIVE_STATE=READ_ONLY/DISARMED" latest/ai-intelligence.txt
          echo "AI_INTELLIGENCE_CROSS_WINDOWS_COMPARE=PASS"
          echo "AI_INTELLIGENCE_FULL_REPOSITORY_PRESERVATION=PASS"
          echo "AI_INTELLIGENCE_DASHBOARD_QUALIFICATION=PASS"
