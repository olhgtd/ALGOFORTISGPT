name: Temporary Apply Task 2 Governance Patch

on:
  push:
    branches:
      - feat/owner-full-control-plane

permissions:
  contents: write

jobs:
  apply-task2:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply bounded patch
        shell: pwsh
        run: python build/tmp_task2_apply.py
      - name: Commit bounded product changes and remove helpers
        shell: pwsh
        run: |
          git config user.name "AlgoFortis Native Worker"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/tmp-task2-apply.yml build/tmp_task2_apply.py
          git add dashboard/backend/owner_admin/step_up.py dashboard/owner-dashboard/authoritative/screens.tsx
          git diff --check
          git commit -m "feat: complete Owner governance controls"
          git push origin HEAD:feat/owner-full-control-plane
