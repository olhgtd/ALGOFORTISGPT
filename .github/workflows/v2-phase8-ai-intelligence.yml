name: V2 Phase 8 AI Intelligence Qualification

on:
  pull_request:
    branches:
      - main
      - v2-phase5-paper-recovery
  workflow_dispatch:

permissions:
  contents: read

jobs:
  g8-windows-latest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.14"
      - name: Install locked dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements-runtime.lock.txt
          python -m pip install -r requirements-dashboard.in
          python -m pip install -r requirements-test.in
      - name: Phase 8 static firewall
        shell: pwsh
        run: python build/tools/check_phase8_ai_intelligence.py
      - name: Phase 8 focused and dependency regression
        shell: pwsh
        run: |
          $phase8 = Get-ChildItem tests_v1/test_phase8_*.py | ForEach-Object { $_.FullName }
          if (-not $phase8) { throw "No Phase 8 tests found" }
          python -m pytest $phase8 tests_v1/test_v2_phase1_adapter_registry.py tests_v1/test_v2_phase3_data_licensing.py -q
      - name: G8 deterministic probe A
        shell: pwsh
        run: python build/tools/phase8_ai_probe.py | Set-Content -Encoding utf8 g8.txt
      - uses: actions/upload-artifact@v4
        with:
          name: g8-a
          path: g8.txt

  g8-windows-2022:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.14"
      - name: Install locked dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements-runtime.lock.txt
          python -m pip install -r requirements-dashboard.in
          python -m pip install -r requirements-test.in
      - name: Phase 8 static firewall
        shell: pwsh
        run: python build/tools/check_phase8_ai_intelligence.py
      - name: Phase 8 focused and dependency regression
        shell: pwsh
        run: |
          $phase8 = Get-ChildItem tests_v1/test_phase8_*.py | ForEach-Object { $_.FullName }
          if (-not $phase8) { throw "No Phase 8 tests found" }
          python -m pytest $phase8 tests_v1/test_v2_phase1_adapter_registry.py tests_v1/test_v2_phase3_data_licensing.py -q
      - name: G8 deterministic probe B
        shell: pwsh
        run: python build/tools/phase8_ai_probe.py | Set-Content -Encoding utf8 g8.txt
      - uses: actions/upload-artifact@v4
        with:
          name: g8-b
          path: g8.txt

  g8-compare:
    name: G8 cross-Windows compare
    runs-on: ubuntu-latest
    needs:
      - g8-windows-latest
      - g8-windows-2022
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: g8-a
          path: a
      - uses: actions/download-artifact@v4
        with:
          name: g8-b
          path: b
      - name: compare deterministic evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          def norm(p):
              return Path(p).read_text(encoding='utf-8-sig').replace('\r\n','\n')
          a,b=norm('a/g8.txt'),norm('b/g8.txt')
          if a != b:
              raise SystemExit('G8 evidence mismatch')
          print('G8_CROSS_WINDOWS_COMPARE=PASS')
          PY
