name: Temporary Owner Entry GREEN 2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-owner-entry-green2.yml'

permissions:
  contents: write

env:
  PYTHONPATH: ${{ github.workspace }}
  ALGOFORTIS_TEST_ALLOW_INSECURE_ACL: "1"
  LIVE_STATE: READ_ONLY/DISARMED

jobs:
  apply-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply exact donor transplant plus bootstrap response correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/tmp-owner-entry-red-green.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(src) if "python - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(src)) if src[i].strip() == 'PY')
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in src[start:end]) + '\n'
          exec(compile(code, '<owner-donor-transplant>', 'exec'), {})

          router = Path('dashboard/backend/account_v2/password_router.py')
          text = router.read_text(encoding='utf-8')

          login_start = text.index('    def _login(')
          login_end = text.index('    def _bootstrap_owner(', login_start)
          login = text[login_start:login_end]
          bad_login = '''        session = _issue_password_session(identity, request)\n        _record_success(limiter, ip_key, identifier_key)\n        payload = _session_payload(session)\n        payload["recovery_codes"] = recovery_codes\n        return payload\n'''
          good_login = '''        session = _issue_password_session(identity, request)\n        _record_success(limiter, ip_key, identifier_key)\n        return _session_payload(session)\n'''
          if bad_login not in login:
              raise SystemExit('transformed login correction marker missing')
          login = login.replace(bad_login, good_login, 1)
          text = text[:login_start] + login + text[login_end:]

          bootstrap_start = text.index('    def _bootstrap_owner(')
          bootstrap_end = text.index('    @router.post("/activate")', bootstrap_start)
          bootstrap = text[bootstrap_start:bootstrap_end]
          old_return = '''            session = _issue_password_session(identity, request)\n            _record_success(limiter, ip_key)\n            return _session_payload(session)\n'''
          new_return = '''            session = _issue_password_session(identity, request)\n            _record_success(limiter, ip_key)\n            payload = _session_payload(session)\n            payload["recovery_codes"] = recovery_codes\n            return payload\n'''
          if old_return not in bootstrap:
              raise SystemExit('bootstrap response marker missing')
          bootstrap = bootstrap.replace(old_return, new_return, 1)
          text = text[:bootstrap_start] + bootstrap + text[bootstrap_end:]
          router.write_text(text, encoding='utf-8')
          PY

      - name: Install complete Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-runtime.lock.txt
          python -m pip install -r requirements-dashboard.in
          python -m pip install -r requirements-test.in

      - name: Owner entry focused GREEN
        run: python -m pytest -q tests_v1/test_owner_entry_manual_parity.py tests_v1/test_owner_entry_recovery_flow.py tests_v1/test_local_desktop_auth.py tests_v1/test_entry_gate_security_boundaries.py tests_v1/test_entry_gate_password_routes.py

      - name: Install frontend dependencies
        run: npm ci --prefix dashboard/web

      - name: Owner React GREEN
        run: npm --prefix dashboard/web exec -- vitest run -c vitest.config.ts src/visual-lab/secure-entry/__tests__/LegacyOwnerSecureEntry.test.tsx

      - name: Frontend typecheck and build
        run: |
          npm --prefix dashboard/web run typecheck
          npm --prefix dashboard/web run build

      - name: Scope-check and commit backend donor transplant
        shell: bash
        run: |
          git diff --check
          python - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          allowed = {
              'dashboard/backend/security_store.py',
              'dashboard/backend/account_v2/password_router.py',
              'dashboard/web/src/api.ts',
          }
          if changed != allowed:
              raise SystemExit(f'Unexpected product scope: {sorted(changed)}')
          PY
          git config user.name "olhgtd"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/backend/security_store.py dashboard/backend/account_v2/password_router.py dashboard/web/src/api.ts
          git commit -m "Restore manual Owner recovery-code entry flow"
          git push origin HEAD:main

  windows-full:
    needs: apply-and-commit
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-runtime.lock.txt
          python -m pip install -r requirements-dashboard.in
          python -m pip install -r requirements-test.in
      - name: Compile Python
        shell: pwsh
        run: python -m compileall -q engine dashboard/backend build/tools tests_v1
      - name: Focused Owner/security regression
        shell: pwsh
        run: python -m pytest -q tests_v1/test_owner_entry_manual_parity.py tests_v1/test_owner_entry_recovery_flow.py tests_v1/test_local_desktop_auth.py tests_v1/test_entry_gate_security_boundaries.py tests_v1/test_entry_gate_password_routes.py
      - name: Canonical safety guards
        shell: pwsh
        run: |
          python build/tools/check_owner_admin_boundary.py
          python build/tools/check_phase6_live_readonly.py
          python build/tools/check_s2_account_gate.py
      - name: Full Python regression
        shell: pwsh
        run: python -m pytest tests_v1 -q
      - name: Install frontend dependencies
        shell: pwsh
        run: npm --prefix dashboard/web ci
      - name: Full dashboard regression
        shell: pwsh
        run: npm --prefix dashboard/web run test:user-dashboard
      - name: Typecheck and production build
        shell: pwsh
        run: |
          npm --prefix dashboard/web run typecheck
          npm --prefix dashboard/web run build
      - name: Final invariants
        shell: pwsh
        run: |
          Write-Host "OWNER_MANUAL_ENTRY=QUALIFIED"
          Write-Host "USER_ENTRY=UNCHANGED"
          Write-Host "DASHBOARD_INTERNALS=UNTOUCHED"
          Write-Host "LIVE_STATE=READ_ONLY/DISARMED"
