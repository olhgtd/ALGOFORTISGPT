name: Temporary Current Source Export For Screens

on:
  push:
    paths:
      - '.github/workflows/tmp-export-current-source-for-screens.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive current source
        run: git archive --format=zip --output=current-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: current-source-for-screens
          path: current-source.zip
          if-no-files-found: error
