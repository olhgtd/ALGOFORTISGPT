name: Temporary Owner Entry RED GREEN

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-owner-entry-red-green.yml'
      - 'tests_v1/test_owner_entry_manual_parity.py'
      - 'dashboard/web/src/visual-lab/secure-entry/__tests__/LegacyOwnerSecureEntry.test.tsx'
      - 'dashboard/web/src/visual-lab/secure-entry/LegacyUserSecureEntryApp.tsx'
      - 'dashboard/web/src/visual-lab/secure-entry/LocalOwnerSetupCard.tsx'
      - 'dashboard/web/src/main.tsx'
      - 'dashboard/backend/security_store.py'
      - 'dashboard/backend/account_v2/password_router.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owner-entry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pytest
        run: python -m pip install pytest
      - name: RED-GREEN Owner source/backend parity
        run: python -m pytest -q tests_v1/test_owner_entry_manual_parity.py
      - name: Install dashboard dependencies
        run: npm ci --prefix dashboard/web
      - name: RED-GREEN Owner React route
        run: npm --prefix dashboard/web exec -- vitest run -c vitest.config.ts src/visual-lab/secure-entry/__tests__/LegacyOwnerSecureEntry.test.tsx
