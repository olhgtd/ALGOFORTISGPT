name: Canonical AlgoFortis Brand Migration

on:
  push:
    branches: [main]
    paths:
      - ".canonical-brand-migration-required"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canonical-algofortis-brand-migration
  cancel-in-progress: false

jobs:
  migrate:
    name: Canonical AlgoFortis migration / Linux
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      ALGOFORTIS_TEST_ALLOW_INSECURE_ACL: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.14"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install RED-test dependency
        run: python -m pip install pytest

      - name: RED — prove legacy brand is currently detected
        run: |
          set +e
          python -m pytest tests_v1/test_canonical_brand.py -q
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "Expected canonical-brand regression to fail before migration, but it passed."
            exit 1
          fi
          echo "CANONICAL_BRAND_RED=CONFIRMED"

      - name: Run canonical brand migration
        run: python build/tools/migrate_canonical_brand.py

      - name: Install Python verification dependencies
        run: |
          python -m pip install -r requirements-runtime.lock.txt
          if [ -f requirements-dashboard.lock.txt ]; then
            python -m pip install -r requirements-dashboard.lock.txt
          else
            python -m pip install -r requirements-dashboard.in
          fi
          python -m pip install -r requirements-test.in

      - name: Canonical brand audit
        run: python build/tools/brand_audit.py

      - name: GREEN — canonical brand regression
        run: python -m pytest tests_v1/test_canonical_brand.py -q

      - name: Full Python regression
        run: python -m pytest -q

      - name: Frontend install and build
        run: |
          npm ci --prefix dashboard/web
          npm --prefix dashboard/web run build

      - name: Commit verified migration directly to main
        run: |
          git config user.name "AlgoFortis Brand Migration"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Migration produced no changes."
            exit 1
          fi
          git commit -m "Complete canonical AlgoFortis brand migration"
          git push origin HEAD:main
