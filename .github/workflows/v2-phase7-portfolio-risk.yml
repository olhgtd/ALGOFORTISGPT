name: V2 Phase 7 Portfolio Risk Qualification

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  LIVE_STATE: READ_ONLY/DISARMED

jobs:
  g7-windows-latest:
    name: G7 Windows latest / Python 3.13.14
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.14"
      - name: Install locked test dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements-runtime.lock.txt
          python -m pip install -r requirements-dashboard.in
          python -m pip install -r requirements-test.in
      - name: Phase 7 architecture firewall
        run: python build/tools/check_phase7_portfolio_risk.py
      - name: Phase 7 focused tests
        run: >-
          python -m pytest
          tests_v1/test_phase7_contracts.py
          tests_v1/test_phase7_architecture_guard.py
          tests_v1/test_phase7_reservations.py
          tests_v1/test_phase7_exposure.py
          tests_v1/test_phase7_circuit_breaker.py
          tests_v1/test_phase7_event_day_policy.py
          tests_v1/test_phase7_portfolio_evaluator.py
          tests_v1/test_phase7_riskgate_integration.py
          tests_v1/test_phase7_attribution.py
          tests_v1/test_phase7_evidence.py
          tests_v1/test_phase7_qualification_guard.py
          -q
      - name: Generate G7 fingerprint A
        shell: pwsh
        run: python build/tools/phase7_probe.py | Out-File -Encoding utf8 g7-a.txt
      - uses: actions/upload-artifact@v4
        with:
          name: g7-fingerprint-a
          path: g7-a.txt

  g7-windows-2022:
    name: G7 Windows 2022 / Python 3.13.14
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.14"
      - name: Install locked test dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements-runtime.lock.txt
          python -m pip install -r requirements-dashboard.in
          python -m pip install -r requirements-test.in
      - name: Phase 7 architecture firewall
        run: python build/tools/check_phase7_portfolio_risk.py
      - name: Phase 7 focused tests
        run: >-
          python -m pytest
          tests_v1/test_phase7_contracts.py
          tests_v1/test_phase7_architecture_guard.py
          tests_v1/test_phase7_reservations.py
          tests_v1/test_phase7_exposure.py
          tests_v1/test_phase7_circuit_breaker.py
          tests_v1/test_phase7_event_day_policy.py
          tests_v1/test_phase7_portfolio_evaluator.py
          tests_v1/test_phase7_riskgate_integration.py
          tests_v1/test_phase7_attribution.py
          tests_v1/test_phase7_evidence.py
          tests_v1/test_phase7_qualification_guard.py
          -q
      - name: Generate G7 fingerprint B
        shell: pwsh
        run: python build/tools/phase7_probe.py | Out-File -Encoding utf8 g7-b.txt
      - uses: actions/upload-artifact@v4
        with:
          name: g7-fingerprint-b
          path: g7-b.txt

  g7-compare:
    name: G7 cross-Windows deterministic fingerprint comparison
    needs: [g7-windows-latest, g7-windows-2022]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: g7-fingerprint-a
          path: a
      - uses: actions/download-artifact@v4
        with:
          name: g7-fingerprint-b
          path: b
      - name: Compare exact evidence
        shell: bash
        run: |
          tr -d '\r' < a/g7-a.txt > a/normalized.txt
          tr -d '\r' < b/g7-b.txt > b/normalized.txt
          diff -u a/normalized.txt b/normalized.txt
          grep -F 'APPROVED_ORDER_AUTHORITY=RISK_GATE_V2_ONLY' a/normalized.txt
          grep -F 'PORTFOLIO_EXPOSURE=THROUGH_RISK_GATE' a/normalized.txt
          grep -F 'LIVE_STATE=READ_ONLY/DISARMED' a/normalized.txt
          grep -F 'G7_ENABLES_REAL_MONEY_TRADING=NO' a/normalized.txt
