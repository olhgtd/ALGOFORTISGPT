name: Temporary User Entry Donor Qualification

on:
  push:
    branches: [main]
    paths:
      - '.tmp/user-entry-donor.trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: user-entry-donor-main
  cancel-in-progress: false

jobs:
  qualify-and-commit:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact seed head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.14'

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Reconstruct and apply archived donor patch
        shell: pwsh
        run: |
          $parts = Get-ChildItem .tmp/user-entry-donor.patch.* | Sort-Object Name
          if (-not $parts) { throw 'Donor patch parts missing' }
          $bytes = New-Object System.Collections.Generic.List[byte]
          foreach ($part in $parts) { $bytes.AddRange([System.IO.File]::ReadAllBytes($part.FullName)) }
          $patchPath = Join-Path $env:RUNNER_TEMP 'user-entry-donor.patch'
          [System.IO.File]::WriteAllBytes($patchPath, $bytes.ToArray())
          $patchText = [System.IO.File]::ReadAllText($patchPath)
          $patchText = [System.Text.RegularExpressions.Regex]::Replace($patchText, "`r+`n", "`n").Replace("`r", "`n")
          [System.IO.File]::WriteAllText($patchPath, $patchText, [System.Text.UTF8Encoding]::new($false))
          git apply --check $patchPath
          git apply $patchPath
          Remove-Item .tmp/user-entry-donor.patch.* -Force

      - name: Verify donor screen sequence is present
        shell: pwsh
        run: |
          $flow = Get-Content dashboard/web/src/visual-lab/secure-entry/LegacyUserFirstTimeCustomerFlow.tsx -Raw
          $required = @(
            'AlgoFortis Access',
            'Enter your invite-only Access ID to proceed.',
            'Already activated? Sign in with email and password',
            'ACCESS ID VERIFIED:',
            'Create Account',
            'CREATE ACCOUNT',
            'ACCESS NOT AUTHORIZED',
            'TRY ANOTHER ACCESS ID'
          )
          foreach ($text in $required) { if (-not $flow.Contains($text)) { throw "Missing donor UI text: $text" } }
          if (-not $flow.Contains('onCompleteActivation(res.access_token')) { throw 'Direct activation-to-workspace donor callback missing' }
          $shell = Get-Content dashboard/web/src/visual-lab/secure-entry/LegacyEntryShell.tsx -Raw
          if (-not $shell.Contains('subhead = "Invite-Only Access"')) { throw 'Donor shell subhead missing' }

      - name: Install Python qualification dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-runtime.lock.txt
          python -m pip install -r requirements-dashboard.in
          python -m pip install -r requirements-test.in

      - name: Python compile
        run: python -m compileall -q engine dashboard build tests_v1 strategies

      - name: Canonical brand and security boundaries
        shell: pwsh
        run: |
          python build/tools/check_canonical_brand.py
          python build/tools/check_owner_admin_boundary.py
          python build/tools/check_s2_account_gate.py
          python build/tools/check_live_reunion_boundary.py

      - name: Full Python regression
        run: python -m pytest tests_v1 -q

      - name: Install Node dependencies
        shell: pwsh
        run: |
          npm ci
          npm ci --prefix dashboard/web

      - name: Dashboard regression
        run: npm --prefix dashboard/web run test:user-dashboard

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Final scope and diff verification
        shell: pwsh
        run: |
          python build/tools/check_canonical_brand.py
          git diff --check
          $changed = git status --short
          Write-Host $changed
          if (-not $changed) { throw 'Donor patch produced no changes' }
          if ($changed -match 'DashboardV3App|dashboard/user-dashboard|dashboard/owner-dashboard') { throw 'Dashboard implementation changed outside allowed entry boundary' }
          Write-Host 'USER_ENTRY_DONOR_PARITY=PASS'
          Write-Host 'DASHBOARD_CONTENTS_TOUCHED=false'
          Write-Host 'LIVE_STATE=READ_ONLY/DISARMED'

      - name: Commit qualified donor User entry directly to main
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore archived User entry flow through dashboard handoff'
          git push origin HEAD:main
