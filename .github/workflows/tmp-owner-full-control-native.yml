name: Temporary Owner Full Control Native Qualification

on:
  push:
    branches:
      - feat/owner-full-control-plane

permissions:
  contents: read

jobs:
  windows-native:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      PYTHONPATH: ${{ github.workspace }}
      ALGOFORTIS_TEST_ALLOW_INSECURE_ACL: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.13.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.14"
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/web/package-lock.json
      - name: Protected engine diff scope
        shell: pwsh
        run: |
          $base = "da9e8f289be675b243f02cca07af0a328837e387"
          $changed = git diff --name-only "$base...HEAD"
          $changed | Set-Content owner-full-control-changed-files.txt
          $bad = $changed | Where-Object { $_ -match '^(engine/live|engine/risk|engine/orders|engine/execution|engine/broker_adapters)/' }
          if ($bad) { Write-Host "Protected engine paths changed:"; $bad; exit 1 }
          Write-Host "PROTECTED_ENGINE_DIFF=PASS"
      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-runtime.lock.txt
          python -m pip install -r requirements-dashboard.in
          python -m pip install -r requirements-test.in
      - name: Full Python regression
        shell: pwsh
        run: python -m pytest tests_v1 -q -p no:cacheprovider
      - name: Owner Admin boundary
        shell: pwsh
        run: python build/tools/check_owner_admin_boundary.py
      - name: S2 account gate
        shell: pwsh
        run: python build/tools/check_s2_account_gate.py
      - name: Phase2 safety spine
        shell: pwsh
        run: python build/tools/check_phase2_safety_spine.py
      - name: Portfolio risk guard
        shell: pwsh
        run: python build/tools/check_phase7_portfolio_risk.py
      - name: Live READ_ONLY firewall
        shell: pwsh
        run: python build/tools/check_phase6_live_readonly.py
      - name: AI decision boundary
        shell: pwsh
        run: python build/tools/check_ai_decision_intelligence_boundary.py
      - name: AI import allowlist
        shell: pwsh
        run: python build/tools/check_ai_import_allowlist.py
      - name: Phase8 AI shadow guard
        shell: pwsh
        run: python build/tools/check_phase8_ai_shadow.py
      - name: Phase9 ProductOps guard
        shell: pwsh
        run: python build/tools/check_phase9_product_ops.py
      - name: Install frontend dependencies
        shell: pwsh
        working-directory: dashboard/web
        run: npm ci
      - name: Full frontend Vitest
        shell: pwsh
        working-directory: dashboard/web
        run: npx vitest run -c vitest.config.ts
      - name: Frontend typecheck
        shell: pwsh
        working-directory: dashboard/web
        run: npm run typecheck
      - name: Frontend production build
        shell: pwsh
        working-directory: dashboard/web
        run: npm run build
      - name: Install Chromium smoke dependency
        shell: pwsh
        working-directory: dashboard/web
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium
      - name: Start dashboard Vite server
        shell: pwsh
        working-directory: dashboard/web
        run: |
          $p = Start-Process -FilePath "npm.cmd" -ArgumentList "run","dev","--","--host","127.0.0.1","--port","4173" -PassThru
          $p.Id | Set-Content "$env:RUNNER_TEMP\algofortis-vite.pid"
          $ready = $false
          for ($i = 0; $i -lt 45; $i++) {
            try { Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:4173/" | Out-Null; $ready = $true; break } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $ready) { throw "Vite server did not become ready" }
      - name: Chromium desktop and mobile Owner smoke
        shell: pwsh
        working-directory: dashboard/web
        run: |
          @'
          import { chromium } from "playwright";
          const base = "http://127.0.0.1:4173/?surface=dashboard-v3&workspace=owner";
          const authority = {
            source: "BACKEND", trust: "FRESH", live_state: "READ_ONLY/DISARMED", broker_mutation: "ABSENT",
            surfaces: {
              health: { authority_state: "AVAILABLE", status: "OK" },
              access: { authority_state: "AVAILABLE", records: [] },
              strategies: { authority_state: "AVAILABLE", strategies: [] },
              connections: { authority_state: "AVAILABLE", connections: [] },
              datasets: { authority_state: "AVAILABLE", datasets: [] },
              security: { authority_state: "AVAILABLE" },
              ai: { authority_state: "AVAILABLE" }
            }, incidents: []
          };
          const productOps = { unresolved_incidents: 0, alert_health: "OK", privacy_requests: [], stale_policy_count: 0, backup_status: "UNAVAILABLE", restore_status: "UNAVAILABLE", rollback_status: "UNAVAILABLE", active_policy_versions: [], runbook_status: "UNAVAILABLE", live_state: "READ_ONLY/DISARMED", ai_authority: "RESEARCH_SHADOW_ONLY" };
          async function installMocks(page, state) {
            await page.addInitScript(() => {
              window.__ALGOFORTIS_SESSION_TOKEN__ = "owner-smoke";
              Object.defineProperty(window, "PublicKeyCredential", { value: function PublicKeyCredential(){}, configurable: true });
            });
            await page.route("**/api/v1/**", async route => {
              const req = route.request(); const u = new URL(req.url()); const p = u.pathname; let status = 200; let body = {};
              if (p === "/api/v1/users/current") body = { user_id: "00000000-0000-0000-0000-000000000001", sx_id: "SX-OWNER", role: "OWNER", lifecycle: "ACTIVE", account_status: "ACTIVE", display_name: "Owner Smoke", namespace: "owner", workspace_eligibility: { user: true, owner: true }, effective_access: true };
              else if (p === "/api/v1/runtime/status") body = { status: "READY", ready: true, available: true };
              else if (p === "/api/v1/owner/admin/authority") body = authority;
              else if (p === "/api/v1/owner/backtests") body = [];
              else if (p === "/api/v1/owner/walkforward/jobs") body = { jobs: [] };
              else if (p === "/api/v1/owner/paper/sessions") body = [];
              else if (p === "/api/v1/owner/deployments") body = { deployments: [] };
              else if (p === "/api/v1/owner/deployments/recovery") body = { state: "AVAILABLE", rows: [] };
              else if (p === "/api/v1/owner/historical/providers") body = { providers: [] };
              else if (p === "/api/v1/owner/historical/sync/jobs") body = { jobs: [] };
              else if (p === "/api/v1/owner/safety") body = { authority_state: "AVAILABLE", safe_mode: { state: "AVAILABLE", enabled: false }, global_hold: { state: "AVAILABLE", enabled: true }, risk_gate: { state: "UNAVAILABLE", reason: "RISK_SNAPSHOT_AUTHORITY_UNAVAILABLE" }, live_state: "READ_ONLY/DISARMED", broker_mutation: "ABSENT", kill_switch: { state: "NOT_CONNECTED", reason: "CANONICAL_KILL_SWITCH_BRIDGE_NOT_ATTACHED" } };
              else if (p === "/api/v1/product-ops/owner/health") body = productOps;
              else if (p === "/api/v1/owner/admin/incidents") body = { incidents: [] };
              else if (p === "/api/v1/integration/audit/events") body = { events: [] };
              else if (p.endsWith("/owner/admin/step-up/options")) { state.stepUpSeen = true; status = 403; body = { detail: "SMOKE_STEP_UP_REQUIRED" }; }
              else if (p === "/api/v1/backtests" && req.method() === "POST") { status = 422; body = { detail: "SMOKE_REJECTION" }; }
              else body = {};
              await route.fulfill({ status, contentType: "application/json", body: JSON.stringify(body) });
            });
          }
          const browser = await chromium.launch({ headless: true });
          try {
            const desktop = await browser.newPage({ viewport: { width: 1440, height: 900 } }); const dstate = { stepUpSeen: false }; await installMocks(desktop, dstate); await desktop.goto(base); await desktop.getByText("OWNER CONTROL CENTER").waitFor({ timeout: 15000 });
            for (const label of ["Backtests / Walk-Forward", "Paper Trading", "Deployments", "Connections & Data", "Risk & Safety", "System Health"]) {
              await desktop.getByRole("button", { name: new RegExp(label.replace(/[.*+?^${}()|[\\]\\]/g, "\\$&"), "i") }).first().click();
            }
            await desktop.getByRole("button", { name: /Backtests \/ Walk-Forward/i }).first().click();
            await desktop.getByPlaceholder("Strategy ID").fill("SMOKE-STRAT"); await desktop.getByPlaceholder("Dataset ID").fill("SMOKE-DATA"); await desktop.getByRole("button", { name: "Run Backtest" }).click(); await desktop.getByText("SMOKE_REJECTION").waitFor({ timeout: 5000 });
            await desktop.getByRole("button", { name: /Risk & Safety/i }).first().click(); await desktop.getByRole("button", { name: "Release Global Hold" }).click(); await desktop.getByText("SMOKE_STEP_UP_REQUIRED").waitFor({ timeout: 5000 }); if (!dstate.stepUpSeen) throw new Error("step-up options route was not requested");
            const mobile = await browser.newPage({ viewport: { width: 390, height: 844 }, isMobile: true, hasTouch: true }); const mstate = { stepUpSeen: false }; await installMocks(mobile, mstate); await mobile.goto(base); await mobile.getByText("OWNER CONTROL CENTER").waitFor({ timeout: 15000 }); await mobile.getByRole("button", { name: /More/i }).click(); await mobile.getByRole("dialog", { name: "More Owner screens" }).waitFor(); await mobile.getByRole("button", { name: /Connections & Data/i }).click(); await mobile.getByRole("heading", { name: "Connections & Data" }).waitFor({ timeout: 5000 });
            console.log("OWNER_BROWSER_SMOKE=PASS");
          } finally { await browser.close(); }
          '@ | Set-Content owner-smoke.mjs
          node owner-smoke.mjs
      - name: Stop Vite server
        if: always()
        shell: pwsh
        run: |
          $pidFile = "$env:RUNNER_TEMP\algofortis-vite.pid"
          if (Test-Path $pidFile) { $id = Get-Content $pidFile; Stop-Process -Id $id -Force -ErrorAction SilentlyContinue }
      - name: Qualified SHA
        shell: pwsh
        run: git rev-parse HEAD
