name: Temporary Owner Full Control Native Qualification

on:
  push:
    branches:
      - feat/owner-full-control-plane

permissions:
  contents: read

jobs:
  windows-native:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      PYTHONPATH: ${{ github.workspace }}
      ALGOFORTIS_TEST_ALLOW_INSECURE_ACL: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.13.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.14"
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/web/package-lock.json
      - name: Protected engine diff scope
        shell: pwsh
        run: |
          $base = "da9e8f289be675b243f02cca07af0a328837e387"
          $changed = git diff --name-only "$base...HEAD"
          $changed | Set-Content owner-full-control-changed-files.txt
          $bad = $changed | Where-Object { $_ -match '^(engine/live|engine/risk|engine/orders|engine/execution|engine/broker_adapters)/' }
          if ($bad) { Write-Host "Protected engine paths changed:"; $bad; exit 1 }
          Write-Host "PROTECTED_ENGINE_DIFF=PASS"
      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-runtime.lock.txt
          python -m pip install -r requirements-dashboard.in
          python -m pip install -r requirements-test.in
      - name: Full Python regression
        shell: pwsh
        run: python -m pytest tests_v1 -q -p no:cacheprovider
      - name: Owner Admin boundary
        shell: pwsh
        run: python build/tools/check_owner_admin_boundary.py
      - name: S2 account gate
        shell: pwsh
        run: python build/tools/check_s2_account_gate.py
      - name: Phase2 safety spine
        shell: pwsh
        run: python build/tools/check_phase2_safety_spine.py
      - name: Portfolio risk guard
        shell: pwsh
        run: python build/tools/check_phase7_portfolio_risk.py
      - name: Live READ_ONLY firewall
        shell: pwsh
        run: python build/tools/check_phase6_live_readonly.py
      - name: AI decision boundary
        shell: pwsh
        run: python build/tools/check_ai_decision_intelligence_boundary.py
      - name: AI import allowlist
        shell: pwsh
        run: python build/tools/check_ai_import_allowlist.py
      - name: Phase8 AI shadow guard
        shell: pwsh
        run: python build/tools/check_phase8_ai_shadow.py
      - name: Phase9 ProductOps guard
        shell: pwsh
        run: python build/tools/check_phase9_product_ops.py
      - name: Install frontend dependencies
        shell: pwsh
        working-directory: dashboard/web
        run: npm ci
      - name: Full frontend Vitest
        shell: pwsh
        working-directory: dashboard/web
        run: npx vitest run -c vitest.config.ts
      - name: Frontend typecheck
        shell: pwsh
        working-directory: dashboard/web
        run: npm run typecheck
      - name: Frontend production build
        shell: pwsh
        working-directory: dashboard/web
        run: npm run build
      - name: Install Chromium smoke dependency
        shell: pwsh
        working-directory: dashboard/web
        run: |
          node -e "console.log('Playwright runtime=' + require('playwright/package.json').version)"
          .\node_modules\.bin\playwright.cmd install chromium
      - name: Start dashboard Vite server
        shell: pwsh
        working-directory: dashboard/web
        run: |
          $p = Start-Process -FilePath "npm.cmd" -ArgumentList "run","dev","--","--host","127.0.0.1","--port","4173" -PassThru
          $p.Id | Set-Content "$env:RUNNER_TEMP\algofortis-vite.pid"
          $ready = $false
          for ($i = 0; $i -lt 45; $i++) {
            try { Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:4173/" | Out-Null; $ready = $true; break } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $ready) { throw "Vite server did not become ready" }
      - name: Chromium desktop and mobile Owner smoke
        shell: pwsh
        working-directory: dashboard/web
        run: node scripts/owner-browser-smoke.mjs
      - name: Stop Vite server
        if: always()
        shell: pwsh
        run: |
          $pidFile = "$env:RUNNER_TEMP\algofortis-vite.pid"
          if (Test-Path $pidFile) { $id = Get-Content $pidFile; Stop-Process -Id $id -Force -ErrorAction SilentlyContinue }
      - name: Qualified SHA
        shell: pwsh
        run: git rev-parse HEAD
