name: RiskGate V2 Deterministic Fast Path Qualification

on:
  workflow_dispatch:
    inputs:
      warm_iterations:
        description: TEST_ONLY warm benchmark sample count for evidence collection
        required: true
        default: "1000"
        type: string
      cold_iterations:
        description: TEST_ONLY cold benchmark sample count for evidence collection
        required: true
        default: "100"
        type: string
      full_regression:
        description: Run the complete tests_v1 regression after focused qualification
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  windows-latest-qualification:
    name: RiskGate fast-path qualification (Windows latest)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}
      ALGOFORTIS_TEST_ALLOW_INSECURE_ACL: "1"
    steps:
      - name: Checkout exact dispatched head
        uses: actions/checkout@v4

      - name: Set up Python 3.13.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.14"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-runtime.lock.txt
          python -m pip install -r requirements-test.in

      - name: Compile fast-path implementation and tests
        shell: pwsh
        run: >-
          python -m compileall -q
          engine/risk/latency_policy_v2.py
          engine/risk/snapshot_contracts_v2.py
          engine/risk/snapshot_publication_v2.py
          engine/risk/snapshot_builder_v2.py
          engine/risk/snapshot_health_v2.py
          engine/risk/fast_path_v2.py
          engine/risk/latency_evidence_v2.py
          engine/risk/latency_benchmark_v2.py
          engine/risk/gate_v2.py
          engine/paper/warm_handoff_v2.py
          build/tools/check_riskgate_fast_path_boundary.py
          build/tools/benchmark_riskgate_fast_path.py
          tests_v1

      - name: Permanent RiskGate fast-path boundary guard
        shell: pwsh
        run: python build/tools/check_riskgate_fast_path_boundary.py

      - name: Existing Live READ_ONLY mutation firewall
        shell: pwsh
        run: python build/tools/check_phase6_live_readonly.py

      - name: Focused fast-path tests
        shell: pwsh
        run: >-
          python -m pytest
          tests_v1/test_riskgate_latency_policy_v2.py
          tests_v1/test_riskgate_snapshot_contracts_v2.py
          tests_v1/test_riskgate_snapshot_publication_v2.py
          tests_v1/test_riskgate_snapshot_builder_v2.py
          tests_v1/test_riskgate_snapshot_health_v2.py
          tests_v1/test_riskgate_fast_path_v2.py
          tests_v1/test_riskgate_latency_evidence_v2.py
          tests_v1/test_riskgate_warm_paper_handoff_v2.py
          tests_v1/test_riskgate_latency_benchmark_v2.py
          tests_v1/test_riskgate_fast_path_boundary.py
          -q

      - name: Existing RiskGate and feed regressions
        shell: pwsh
        run: >-
          python -m pytest
          tests_v1/test_v2_phase2_risk_gate_authority.py
          tests_v1/test_v2_phase2_hard_limits.py
          tests_v1/test_v2_phase2_intent_guard.py
          tests_v1/test_v2_phase2_kill_switch.py
          tests_v1/test_v2_phase2_mode_isolation.py
          tests_v1/test_v2_phase3_live_feed.py
          -q

      - name: Validate benchmark iteration inputs
        shell: pwsh
        run: |
          $warm = 0
          $cold = 0
          if (-not [int]::TryParse("${{ inputs.warm_iterations }}", [ref]$warm) -or $warm -le 0) {
            throw "warm_iterations must be a positive integer"
          }
          if (-not [int]::TryParse("${{ inputs.cold_iterations }}", [ref]$cold) -or $cold -le 0) {
            throw "cold_iterations must be a positive integer"
          }

      - name: Collect warm Paper/Shadow benchmark evidence
        shell: pwsh
        run: >-
          python build/tools/benchmark_riskgate_fast_path.py
          --fixture build/fixtures/riskgate_fast_path_test_only.json
          --code-sha ${{ github.sha }}
          --iterations ${{ inputs.warm_iterations }}
          --warm true
          --output riskgate-fast-path-warm.json

      - name: Collect cold Paper/Shadow benchmark evidence
        shell: pwsh
        run: >-
          python build/tools/benchmark_riskgate_fast_path.py
          --fixture build/fixtures/riskgate_fast_path_test_only.json
          --code-sha ${{ github.sha }}
          --iterations ${{ inputs.cold_iterations }}
          --warm false
          --output riskgate-fast-path-cold.json

      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: riskgate-fast-path-benchmark-${{ github.sha }}
          path: |
            riskgate-fast-path-warm.json
            riskgate-fast-path-cold.json
          if-no-files-found: error

      - name: Full Python regression
        if: ${{ inputs.full_regression }}
        shell: pwsh
        run: python -m pytest tests_v1 -q

      - name: Record exact qualified SHA
        shell: pwsh
        run: git rev-parse HEAD

  windows-2022-safety-crosscheck:
    name: RiskGate fast-path safety cross-check (Windows 2022)
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
      ALGOFORTIS_TEST_ALLOW_INSECURE_ACL: "1"
    steps:
      - name: Checkout exact dispatched head
        uses: actions/checkout@v4

      - name: Set up Python 3.13.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.14"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-runtime.lock.txt
          python -m pip install -r requirements-test.in

      - name: Compile fast-path implementation
        shell: pwsh
        run: >-
          python -m compileall -q
          engine/risk/latency_policy_v2.py
          engine/risk/snapshot_contracts_v2.py
          engine/risk/snapshot_publication_v2.py
          engine/risk/snapshot_builder_v2.py
          engine/risk/snapshot_health_v2.py
          engine/risk/fast_path_v2.py
          engine/risk/latency_evidence_v2.py
          engine/risk/latency_benchmark_v2.py
          engine/risk/gate_v2.py
          engine/paper/warm_handoff_v2.py
          build/tools/check_riskgate_fast_path_boundary.py

      - name: RiskGate fast-path boundary guard
        shell: pwsh
        run: python build/tools/check_riskgate_fast_path_boundary.py

      - name: Live READ_ONLY mutation firewall
        shell: pwsh
        run: python build/tools/check_phase6_live_readonly.py

      - name: Focused fast-path and authority tests
        shell: pwsh
        run: >-
          python -m pytest
          tests_v1/test_riskgate_latency_policy_v2.py
          tests_v1/test_riskgate_snapshot_contracts_v2.py
          tests_v1/test_riskgate_snapshot_publication_v2.py
          tests_v1/test_riskgate_snapshot_builder_v2.py
          tests_v1/test_riskgate_snapshot_health_v2.py
          tests_v1/test_riskgate_fast_path_v2.py
          tests_v1/test_riskgate_latency_evidence_v2.py
          tests_v1/test_riskgate_warm_paper_handoff_v2.py
          tests_v1/test_riskgate_latency_benchmark_v2.py
          tests_v1/test_riskgate_fast_path_boundary.py
          tests_v1/test_v2_phase2_risk_gate_authority.py
          tests_v1/test_v2_phase2_hard_limits.py
          tests_v1/test_v2_phase2_intent_guard.py
          tests_v1/test_v2_phase2_kill_switch.py
          tests_v1/test_v2_phase2_mode_isolation.py
          tests_v1/test_v2_phase3_live_feed.py
          -q

      - name: Record cross-check SHA
        shell: pwsh
        run: git rev-parse HEAD
