name: V2 Phase 0 Baseline Verification

on:
  push:
    branches:
      - v2-phase0-baseline-audit
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-head-regression-a:
    name: Current HEAD regression A (Windows / Python 3.13)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
      SENTINELX_TEST_ALLOW_INSECURE_ACL: "1"
      ALGOFORTIS_TEST_ALLOW_INSECURE_ACL: "1"
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install locked runtime and test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-runtime.lock.txt
          python -m pip install -r requirements-dashboard.in
          python -m pip install pytest==9.1.1
      - name: Record environment
        shell: pwsh
        run: |
          python --version
          python -m pip --version
          git rev-parse HEAD
      - name: Full V1 test suite
        shell: pwsh
        run: python -m pytest tests_v1 -q
      - name: Existing regression certification
        shell: pwsh
        run: python build/tools/run_regression_certification.py

  current-head-regression-b:
    name: Current HEAD regression B (independent Windows / Python 3.13)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
      SENTINELX_TEST_ALLOW_INSECURE_ACL: "1"
      ALGOFORTIS_TEST_ALLOW_INSECURE_ACL: "1"
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install locked runtime and test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-runtime.lock.txt
          python -m pip install -r requirements-dashboard.in
          python -m pip install pytest==9.1.1
      - name: Record environment
        shell: pwsh
        run: |
          python --version
          python -m pip --version
          git rev-parse HEAD
      - name: Full V1 test suite
        shell: pwsh
        run: python -m pytest tests_v1 -q
      - name: Existing regression certification
        shell: pwsh
        run: python build/tools/run_regression_certification.py
