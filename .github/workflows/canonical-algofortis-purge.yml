name: Canonical AlgoFortis Brand Guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-algofortis-brand-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  canonical-brand:
    name: Repository-wide retired-brand firewall
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
      - name: Set up Python 3.13.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.14'
      - name: Zero-reference canonical brand audit
        run: python build/tools/check_canonical_brand.py
      - name: Compile permanent brand guard
        run: python -m compileall -q build/tools/check_canonical_brand.py tests_v1/test_canonical_brand.py
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Permanent regression test
        run: python -m pytest tests_v1/test_canonical_brand.py -q
      - name: Safety marker
        run: |
          echo 'CANONICAL_BRAND=ALGOFORTIS_ONLY'
          echo 'LIVE_STATE=READ_ONLY/DISARMED'
