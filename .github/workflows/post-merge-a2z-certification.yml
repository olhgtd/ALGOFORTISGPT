name: Temporary Post-Merge A-to-Z Certification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: post-merge-a2z-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  QUALIFIED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  PYTHONPATH: ${{ github.workspace }}
  SENTINELX_TEST_ALLOW_INSECURE_ACL: "1"
  ALGOFORTIS_TEST_ALLOW_INSECURE_ACL: "1"

jobs:
  extended-windows-latest:
    name: A-to-Z extended qualification / Windows latest
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.QUALIFIED_HEAD }}

      - name: Assert exact certification head
        shell: pwsh
        run: |
          $actual = git rev-parse HEAD
          if ($actual -ne $env:QUALIFIED_HEAD) { throw "Expected $env:QUALIFIED_HEAD but checked out $actual" }
          Write-Host "A2Z_TESTED_HEAD=$actual"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.14"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-runtime.lock.txt
          python -m pip install -r requirements-dashboard.in
          python -m pip install -r requirements-test.in

      - name: Compile complete current source tree
        run: python -m compileall -q engine dashboard build tests_v1 strategies

      - name: Run all current static and authority guards
        shell: pwsh
        run: |
          $guards = @(
            'build/tools/check_module_boundaries.py',
            'build/tools/check_phase1_foundation.py',
            'build/tools/check_phase2_safety_spine.py',
            'build/tools/check_phase3_data_v2.py',
            'build/tools/check_phase4_research_backtest.py',
            'build/tools/check_phase5_paper_recovery.py',
            'build/tools/check_phase6_live_readonly.py',
            'build/tools/check_phase7_portfolio_risk.py',
            'build/tools/check_phase8_ai_shadow.py',
            'build/tools/check_phase9_product_ops.py',
            'build/tools/check_live_reunion_boundary.py',
            'build/tools/check_riskgate_fast_path_boundary.py',
            'build/tools/check_owner_admin_boundary.py',
            'build/tools/check_s2_account_gate.py',
            'build/tools/check_ai_decision_intelligence_boundary.py'
          )
          foreach ($guard in $guards) {
            Write-Host "=== $guard ==="
            python $guard
            if ($LASTEXITCODE -ne 0) { throw "$guard failed with exit code $LASTEXITCODE" }
          }

      - name: Full Python regression
        run: python -m pytest tests_v1 -q

      - name: Existing regression certification
        run: python build/tools/run_regression_certification.py

      - name: All current deterministic probes
        shell: pwsh
        run: |
          $probes = @(
            'build/tools/phase4_probe.py',
            'build/tools/phase5_probe.py',
            'build/tools/phase6_probe.py',
            'build/tools/phase7_probe.py',
            'build/tools/phase8_ai_probe.py',
            'build/tools/phase9_product_ops_probe.py',
            'build/tools/s2_deterministic_probe.py',
            'build/tools/ai_decision_intelligence_probe.py'
          )
          foreach ($probe in $probes) {
            Write-Host "=== $probe ==="
            python $probe
            if ($LASTEXITCODE -ne 0) { throw "$probe failed with exit code $LASTEXITCODE" }
          }

      - name: Owner Admin AI Entry Gate focused qualification
        shell: pwsh
        run: >-
          python -m pytest
          tests_v1/test_owner_admin_boundary_guard.py
          tests_v1/test_owner_admin_contracts.py
          tests_v1/test_owner_admin_step_up_policy.py
          tests_v1/test_owner_admin_ai_control_plane.py
          tests_v1/test_owner_admin_ai_credentials.py
          tests_v1/test_owner_singleton_bootstrap_policy.py
          tests_v1/test_entry_gate_password_accounts.py
          tests_v1/test_entry_gate_password_routes.py
          tests_v1/test_entry_gate_security_boundaries.py
          tests_v1/test_local_desktop_auth.py
          -q

      - name: S2 focused regression
        run: python -m pytest tests_v1 -k s2_ -q

      - name: RiskGate fast-path focused qualification
        shell: pwsh
        run: >-
          python -m pytest
          tests_v1/test_riskgate_latency_policy_v2.py
          tests_v1/test_riskgate_snapshot_contracts_v2.py
          tests_v1/test_riskgate_snapshot_publication_v2.py
          tests_v1/test_riskgate_snapshot_builder_v2.py
          tests_v1/test_riskgate_snapshot_health_v2.py
          tests_v1/test_riskgate_fast_path_v2.py
          tests_v1/test_riskgate_latency_evidence_v2.py
          tests_v1/test_riskgate_warm_paper_handoff_v2.py
          tests_v1/test_riskgate_latency_benchmark_v2.py
          tests_v1/test_riskgate_fast_path_boundary.py
          tests_v1/test_v2_phase2_risk_gate_authority.py
          tests_v1/test_v2_phase2_hard_limits.py
          tests_v1/test_v2_phase2_intent_guard.py
          tests_v1/test_v2_phase2_kill_switch.py
          tests_v1/test_v2_phase2_mode_isolation.py
          tests_v1/test_v2_phase3_live_feed.py
          -q

      - name: RiskGate warm benchmark evidence
        run: >-
          python build/tools/benchmark_riskgate_fast_path.py
          --fixture build/fixtures/riskgate_fast_path_test_only.json
          --code-sha ${{ env.QUALIFIED_HEAD }}
          --iterations 1000
          --warm true
          --output riskgate-fast-path-warm.json

      - name: RiskGate cold benchmark evidence
        run: >-
          python build/tools/benchmark_riskgate_fast_path.py
          --fixture build/fixtures/riskgate_fast_path_test_only.json
          --code-sha ${{ env.QUALIFIED_HEAD }}
          --iterations 100
          --warm false
          --output riskgate-fast-path-cold.json

      - name: WebAuthn security certification
        run: python build/tools/certify_webauthn_security.py

      - name: Windows ACL security certification
        run: python build/tools/certify_phase7_acl.py

      - name: Install root Node package
        run: npm ci

      - name: Root dependency security audit
        run: npm audit --audit-level=high

      - name: Install dashboard package
        run: npm ci --prefix dashboard/web

      - name: Dashboard dependency security audit
        run: npm audit --prefix dashboard/web --audit-level=high

      - name: Dashboard user owner regression
        run: npm --prefix dashboard/web run test:user-dashboard

      - name: Dashboard typecheck
        run: npm run typecheck

      - name: Dashboard production build
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: post-merge-a2z-riskgate-${{ env.QUALIFIED_HEAD }}
          path: |
            riskgate-fast-path-warm.json
            riskgate-fast-path-cold.json
          if-no-files-found: error

  extended-windows-2022:
    name: A-to-Z safety cross-check / Windows 2022
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.QUALIFIED_HEAD }}

      - name: Assert exact certification head
        shell: pwsh
        run: |
          $actual = git rev-parse HEAD
          if ($actual -ne $env:QUALIFIED_HEAD) { throw "Expected $env:QUALIFIED_HEAD but checked out $actual" }
          Write-Host "A2Z_CROSSCHECK_HEAD=$actual"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.14"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-runtime.lock.txt
          python -m pip install -r requirements-dashboard.in
          python -m pip install -r requirements-test.in

      - name: Cross-check authority guards
        shell: pwsh
        run: |
          python build/tools/check_module_boundaries.py
          python build/tools/check_phase6_live_readonly.py
          python build/tools/check_phase7_portfolio_risk.py
          python build/tools/check_phase8_ai_shadow.py
          python build/tools/check_phase9_product_ops.py
          python build/tools/check_live_reunion_boundary.py
          python build/tools/check_riskgate_fast_path_boundary.py
          python build/tools/check_owner_admin_boundary.py
          python build/tools/check_s2_account_gate.py
          python build/tools/check_ai_decision_intelligence_boundary.py

      - name: Owner Admin and RiskGate cross-check
        shell: pwsh
        run: >-
          python -m pytest
          tests_v1/test_owner_admin_boundary_guard.py
          tests_v1/test_owner_admin_contracts.py
          tests_v1/test_owner_admin_step_up_policy.py
          tests_v1/test_owner_admin_ai_control_plane.py
          tests_v1/test_owner_admin_ai_credentials.py
          tests_v1/test_owner_singleton_bootstrap_policy.py
          tests_v1/test_entry_gate_password_accounts.py
          tests_v1/test_entry_gate_password_routes.py
          tests_v1/test_entry_gate_security_boundaries.py
          tests_v1/test_local_desktop_auth.py
          tests_v1/test_riskgate_latency_policy_v2.py
          tests_v1/test_riskgate_snapshot_contracts_v2.py
          tests_v1/test_riskgate_snapshot_publication_v2.py
          tests_v1/test_riskgate_snapshot_builder_v2.py
          tests_v1/test_riskgate_snapshot_health_v2.py
          tests_v1/test_riskgate_fast_path_v2.py
          tests_v1/test_riskgate_latency_evidence_v2.py
          tests_v1/test_riskgate_warm_paper_handoff_v2.py
          tests_v1/test_riskgate_latency_benchmark_v2.py
          tests_v1/test_riskgate_fast_path_boundary.py
          tests_v1/test_v2_phase2_risk_gate_authority.py
          tests_v1/test_v2_phase2_hard_limits.py
          tests_v1/test_v2_phase2_intent_guard.py
          tests_v1/test_v2_phase2_kill_switch.py
          tests_v1/test_v2_phase2_mode_isolation.py
          tests_v1/test_v2_phase3_live_feed.py
          -q

      - name: WebAuthn security cross-check
        run: python build/tools/certify_webauthn_security.py
