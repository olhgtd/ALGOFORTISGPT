name: Temporary S2 Linux Smoke

on:
  push:
    branches:
      - v2-s2-qualification-20260926

permissions:
  contents: read

jobs:
  s2-linux-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
      SENTINELX_TEST_ALLOW_INSECURE_ACL: "1"
      ALGOFORTIS_TEST_ALLOW_INSECURE_ACL: "1"
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4
      - name: Set up Python 3.13.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.14"
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-runtime.lock.txt
          python -m pip install -r requirements-dashboard.in
          python -m pip install -r requirements-test.in
      - name: Compile S2 code and tests
        run: python -m compileall -q dashboard/backend/account_v2 build/tools/s2_deterministic_probe.py build/tools/check_s2_account_gate.py tests_v1/test_s2_repository.py tests_v1/test_s2_device_service.py tests_v1/test_s2_inv04_isolation.py tests_v1/test_s2_evidence.py
      - name: S2 static boundary guard
        run: python build/tools/check_s2_account_gate.py
      - name: Device challenge and repository focused tests
        run: python -m pytest tests_v1/test_s2_repository.py tests_v1/test_s2_device_service.py tests_v1/test_s2_inv04_isolation.py tests_v1/test_s2_evidence.py -q
      - name: Deterministic GP-S2 probe
        run: python build/tools/s2_deterministic_probe.py
