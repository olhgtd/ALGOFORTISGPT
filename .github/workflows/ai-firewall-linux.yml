name: AI Firewall (Linux)

# Cross-platform guard: the AI/Laya authority firewall is pure Python and must hold
# on Linux too (e.g. a future AWS runtime). Windows-only DPAPI/TPM tests are NOT run here.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-firewall-linux-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  ai-firewall:
    name: AI/Laya authority firewall / ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.14"
      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements-runtime.lock.txt
          python -m pip install -r requirements-dashboard.lock.txt
          python -m pip install -r requirements-test.in
      - name: Authority boundary guards
        run: |
          python build/tools/check_ai_decision_intelligence_boundary.py
          python build/tools/check_ai_import_allowlist.py
          python build/tools/check_phase8_ai_shadow.py
          python build/tools/check_owner_admin_boundary.py
      - name: AI / Laya tests
        run: python -m pytest tests_v1/test_ai_*.py tests_v1/test_phase8_*.py tests_v1/test_owner_admin_decision_intelligence.py tests_v1/test_owner_admin_ai_control_plane.py -q
