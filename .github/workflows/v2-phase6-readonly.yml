name: V2 Phase 6 Multi-Broker Read-Only Qualification

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  LIVE_STATE: READ_ONLY/DISARMED

jobs:
  g6-windows-latest:
    name: G6 Windows latest / Python 3.13.14
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.14"
      - name: Install locked test dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements-runtime.lock.txt
          python -m pip install -r requirements-dashboard.in
          python -m pip install -r requirements-test.in
      - name: Phase 6 structural mutation firewall
        run: python build/tools/check_phase6_live_readonly.py
      - name: Phase 6 focused multi-broker tests
        run: >-
          python -m pytest
          tests_v1/test_phase6_readonly_contracts.py
          tests_v1/test_phase6_architecture_guard.py
          tests_v1/test_phase6_rate_policy.py
          tests_v1/test_phase6_compliance_gate.py
          tests_v1/test_phase6_angelone_session.py
          tests_v1/test_phase6_angelone_read_only_adapter.py
          tests_v1/test_phase6_read_only_conformance.py
          tests_v1/test_phase6_live_reconciliation.py
          tests_v1/test_phase6_foreign_activity_incidents.py
          tests_v1/test_phase6_order_policy.py
          tests_v1/test_phase6_protection_capability.py
          tests_v1/test_phase6_connectivity_chaos.py
          tests_v1/test_phase6_transport_contracts.py
          tests_v1/test_phase6_transport_runtime.py
          tests_v1/test_phase6_transport_runtime_subscriptions.py
          tests_v1/test_phase6_market_event_bridge.py
          tests_v1/test_phase6_feed_monitor_multi_instrument.py
          tests_v1/test_phase6_feed_riskgate_handoff.py
          tests_v1/test_phase6_broker_normalizer_bridge.py
          tests_v1/test_phase6_transport_angelone.py
          tests_v1/test_phase6_transport_zerodha.py
          tests_v1/test_phase6_transport_dhan.py
          tests_v1/test_phase6_transport_upstox.py
          tests_v1/test_phase6_transport_registry.py
          tests_v1/test_phase6_transport_extension.py
          tests_v1/test_phase6_transport_conformance.py
          tests_v1/test_phase6_upstox_single_lifecycle_authority.py
          tests_v1/test_v2_phase3_live_feed.py
          tests_v1/test_phase6_evidence.py
          tests_v1/test_phase6_qualification_guard.py
          -q
      - name: Generate G6 fingerprint A
        shell: pwsh
        run: python build/tools/phase6_probe.py | Out-File -Encoding utf8 g6-a.txt
      - uses: actions/upload-artifact@v4
        with:
          name: g6-fingerprint-a
          path: g6-a.txt

  g6-windows-2022:
    name: G6 Windows 2022 / Python 3.13.14
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.14"
      - name: Install locked test dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements-runtime.lock.txt
          python -m pip install -r requirements-dashboard.in
          python -m pip install -r requirements-test.in
      - name: Phase 6 structural mutation firewall
        run: python build/tools/check_phase6_live_readonly.py
      - name: Phase 6 focused multi-broker tests
        run: >-
          python -m pytest
          tests_v1/test_phase6_readonly_contracts.py
          tests_v1/test_phase6_architecture_guard.py
          tests_v1/test_phase6_rate_policy.py
          tests_v1/test_phase6_compliance_gate.py
          tests_v1/test_phase6_angelone_session.py
          tests_v1/test_phase6_angelone_read_only_adapter.py
          tests_v1/test_phase6_read_only_conformance.py
          tests_v1/test_phase6_live_reconciliation.py
          tests_v1/test_phase6_foreign_activity_incidents.py
          tests_v1/test_phase6_order_policy.py
          tests_v1/test_phase6_protection_capability.py
          tests_v1/test_phase6_connectivity_chaos.py
          tests_v1/test_phase6_transport_contracts.py
          tests_v1/test_phase6_transport_runtime.py
          tests_v1/test_phase6_transport_runtime_subscriptions.py
          tests_v1/test_phase6_market_event_bridge.py
          tests_v1/test_phase6_feed_monitor_multi_instrument.py
          tests_v1/test_phase6_feed_riskgate_handoff.py
          tests_v1/test_phase6_broker_normalizer_bridge.py
          tests_v1/test_phase6_transport_angelone.py
          tests_v1/test_phase6_transport_zerodha.py
          tests_v1/test_phase6_transport_dhan.py
          tests_v1/test_phase6_transport_upstox.py
          tests_v1/test_phase6_transport_registry.py
          tests_v1/test_phase6_transport_extension.py
          tests_v1/test_phase6_transport_conformance.py
          tests_v1/test_phase6_upstox_single_lifecycle_authority.py
          tests_v1/test_v2_phase3_live_feed.py
          tests_v1/test_phase6_evidence.py
          tests_v1/test_phase6_qualification_guard.py
          -q
      - name: Generate G6 fingerprint B
        shell: pwsh
        run: python build/tools/phase6_probe.py | Out-File -Encoding utf8 g6-b.txt
      - uses: actions/upload-artifact@v4
        with:
          name: g6-fingerprint-b
          path: g6-b.txt

  g6-compare:
    name: G6 cross-Windows deterministic fingerprint comparison
    needs: [g6-windows-latest, g6-windows-2022]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: g6-fingerprint-a
          path: a
      - uses: actions/download-artifact@v4
        with:
          name: g6-fingerprint-b
          path: b
      - name: Compare exact evidence
        shell: bash
        run: |
          tr -d '\r' < a/g6-a.txt > a/normalized.txt
          tr -d '\r' < b/g6-b.txt > b/normalized.txt
          diff -u a/normalized.txt b/normalized.txt
          grep -F 'BROKER_SCOPE=ANGELONE,ZERODHA,DHAN,UPSTOX' a/normalized.txt
          grep -F 'MARKET_DATA_TRANSPORT=SHARED_RUNTIME_THIN_DRIVERS' a/normalized.txt
          grep -F 'RISK_GATE_FEED_BLOCK=DAT_005_008_EXISTING_PATH' a/normalized.txt
          grep -F 'SOURCE_SEQUENCE=EXPLICIT_SEMANTICS_NO_FABRICATION' a/normalized.txt
          grep -F 'LIVE_STATE=READ_ONLY/DISARMED' a/normalized.txt
          grep -F 'REAL_BROKER_MUTATION_CAPABILITY=ABSENT' a/normalized.txt
          grep -F 'G6_ENABLES_REAL_MONEY_TRADING=NO' a/normalized.txt
