name: Temporary Owner Failure Summary

on:
  push:
    branches:
      - feat/owner-full-control-plane

permissions:
  contents: write

jobs:
  summarize:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
      ALGOFORTIS_TEST_ALLOW_INSECURE_ACL: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.14"
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-runtime.lock.txt
          python -m pip install -r requirements-dashboard.in
          python -m pip install -r requirements-test.in
      - name: Run and summarize failures
        shell: pwsh
        run: |
          python -m pytest tests_v1 -q -p no:cacheprovider --junitxml=build/owner_diag.xml
          @'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          root = ET.parse("build/owner_diag.xml").getroot()
          suites = root.findall("testsuite") if root.tag == "testsuites" else [root]
          lines = []
          for suite in suites:
              for case in suite.findall("testcase"):
                  failure = case.find("failure")
                  error = case.find("error")
                  node = failure if failure is not None else error
                  if node is None:
                      continue
                  name = f"{case.attrib.get('classname','')}::{case.attrib.get('name','')}"
                  msg = (node.attrib.get('message') or '').strip().replace('\r',' ').replace('\n',' ')
                  body = (node.text or '').strip().replace('\r',' ').replace('\n',' ')
                  lines.append(name)
                  lines.append("MESSAGE: " + msg[:1000])
                  lines.append("DETAIL: " + body[:3000])
                  lines.append("")
          if not lines:
              lines = ["NO_FAILURES"]
          Path("build/owner_failure_summary.txt").write_text("\n".join(lines), encoding="utf-8")
          '@ | Set-Content -Encoding utf8 build/parse_owner_failures.py
          python build/parse_owner_failures.py
          exit 0
      - name: Commit summary and remove workflow
        shell: pwsh
        run: |
          git config user.name "AlgoFortis Native Worker"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/tmp-owner-failure-summary.yml
          git add build/owner_failure_summary.txt
          git commit -m "chore: capture exact Owner control failure summary"
          git push origin HEAD:feat/owner-full-control-plane
