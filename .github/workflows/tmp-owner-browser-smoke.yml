# trigger: registered workflow rerun
name: Temporary Owner Browser Smoke

on:
  push:
    branches:
      - feat/owner-full-control-plane

permissions:
  contents: read

jobs:
  owner-browser-smoke:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/web/package-lock.json
      - name: Install frontend and matching Chromium
        shell: pwsh
        working-directory: dashboard/web
        run: |
          npm ci
          node -e "console.log('Playwright runtime=' + require('playwright/package.json').version)"
          .\node_modules\.bin\playwright.cmd install chromium
      - name: Start dashboard Vite server
        shell: pwsh
        working-directory: dashboard/web
        run: |
          $p = Start-Process -FilePath "npm.cmd" -ArgumentList "run","dev","--","--host","127.0.0.1","--port","4173" -PassThru
          $p.Id | Set-Content "$env:RUNNER_TEMP\algofortis-vite.pid"
          $ready = $false
          for ($i = 0; $i -lt 45; $i++) {
            try { Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:4173/" | Out-Null; $ready = $true; break } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $ready) { throw "Vite server did not become ready" }
      - name: Chromium desktop and mobile Owner smoke
        shell: pwsh
        working-directory: dashboard/web
        run: node scripts/owner-browser-smoke.mjs
      - name: Stop Vite server
        if: always()
        shell: pwsh
        run: |
          $pidFile = "$env:RUNNER_TEMP\algofortis-vite.pid"
          if (Test-Path $pidFile) { $id = Get-Content $pidFile; Stop-Process -Id $id -Force -ErrorAction SilentlyContinue }
