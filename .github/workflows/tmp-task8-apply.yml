name: Temporary Apply Task 8 Owner System

on:
  push:
    branches:
      - feat/owner-full-control-plane

permissions:
  contents: write

jobs:
  apply-task8:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply bounded Task 8 patch
        shell: pwsh
        run: python build/tmp_task8_apply.py
      - name: Commit product changes and remove temporary helpers
        shell: pwsh
        run: |
          git config user.name "AlgoFortis Native Worker"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/tmp-task8-apply.yml build/tmp_task8_apply.py
          git add dashboard/owner-dashboard/OwnerDashboardApp.tsx
          git diff --check
          git commit -m "feat: add safe Owner system operations"
          git push origin HEAD:feat/owner-full-control-plane
