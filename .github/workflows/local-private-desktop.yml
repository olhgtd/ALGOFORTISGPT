name: AlgoFortis Local-Private Windows Desktop Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  QUALIFIED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  local-private-windows:
    name: Local-private installer + double-click qualification
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.QUALIFIED_HEAD }}

      - name: Assert exact implementation head
        shell: pwsh
        run: |
          $actual = git rev-parse HEAD
          if ($actual -ne $env:QUALIFIED_HEAD) { throw "Expected $env:QUALIFIED_HEAD but checked out $actual" }
          Write-Host "LOCAL_PRIVATE_TESTED_HEAD=$actual"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.14'

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install qualification dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements-test.in
          choco install innosetup --no-progress -y

      - name: Local-private behavior contract
        shell: pwsh
        run: python -m pytest tests_v1/test_local_private_desktop_behavior.py -q

      - name: Build unsigned private installer
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File build/tools/build_installer.ps1 -OutputBaseFilename AlgoFortis-Setup
          if ($LASTEXITCODE -ne 0) { throw "Private installer build failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path build/installer/AlgoFortis-Setup.exe)) { throw "AlgoFortis-Setup.exe missing" }
          $sig = Get-AuthenticodeSignature build/installer/AlgoFortis-Setup.exe
          if ($sig.Status -eq 'Valid') { throw "Private qualification installer unexpectedly carries a production-trusted signature" }
          Write-Host "PRIVATE_INSTALLER=BUILT_UNSIGNED_EXPECTED"
          Write-Host "LIVE_STATE=READ_ONLY/DISARMED"

      - name: Native desktop shell double-click certification
        shell: pwsh
        run: python build/tools/certify_desktop_shell.py

      - name: Installed lifecycle and data-preservation certification
        shell: pwsh
        run: python build/tools/certify_phase9_phase10_installation.py

      - name: Capture installer hashes
        shell: pwsh
        run: |
          Get-FileHash build/installer/AlgoFortis-Setup.exe -Algorithm SHA256 | Format-List
          Get-Content build/installer/AlgoFortis-Setup.exe.evidence.json

      - uses: actions/upload-artifact@v4
        with:
          name: AlgoFortis-LocalPrivate-Windows-${{ env.QUALIFIED_HEAD }}
          path: |
            build/installer/AlgoFortis-Setup.exe
            build/installer/AlgoFortis-Setup.exe.evidence.json
            build/evidence/**
          if-no-files-found: error
