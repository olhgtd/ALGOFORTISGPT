name: Temporary Main Source Export

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-export-main-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Archive exact source head
        run: git archive --format=zip --output=current-main-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: current-main-source
          path: current-main-source.zip
          if-no-files-found: error
          retention-days: 1
