name: Temporary Owner Settings Wiring Baseline

on:
  push:
    branches:
      - fix/owner-settings-wiring
    paths:
      - '.github/workflows/tmp-owner-settings-baseline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}
      ALGOFORTIS_TEST_ALLOW_INSECURE_ACL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.14"
      - name: Python version
        shell: pwsh
        run: python --version
      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-runtime.lock.txt
          python -m pip install -r requirements-dashboard.in
          python -m pip install -r requirements-test.in
      - name: Baseline full Python suite
        shell: pwsh
        run: python -m pytest tests_v1 -q -p no:cacheprovider
      - name: Record baseline SHA
        shell: pwsh
        run: git rev-parse HEAD
