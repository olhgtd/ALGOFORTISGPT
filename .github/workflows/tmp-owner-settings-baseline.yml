name: Temporary Apply Owner Settings Wiring Fix

on:
  push:
    branches:
      - fix/owner-settings-wiring
    paths:
      - '.github/workflows/tmp-owner-settings-baseline.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/owner-settings-wiring
          fetch-depth: 0
      - name: Apply exact three production replacements
        shell: pwsh
        run: |
          $api = 'dashboard/owner-dashboard/authoritative/api.ts'
          $text = Get-Content $api -Raw
          $old = '"/api/v1/owner/settings"'
          $new = '"/api/v1/settings"'
          if (($text.Split($old).Count - 1) -ne 1) { throw "Unexpected api.ts replacement count" }
          Set-Content $api ($text.Replace($old, $new)) -NoNewline

          $mut = 'dashboard/owner-dashboard/authoritative/mutations.ts'
          $text = Get-Content $mut -Raw
          foreach ($pair in @(
            @('"/api/v1/owner/settings/propose"', '"/api/v1/settings/propose"'),
            @('"/api/v1/owner/settings/confirm"', '"/api/v1/settings/confirm"')
          )) {
            if (($text.Split($pair[0]).Count - 1) -ne 1) { throw "Unexpected mutations.ts replacement count: $($pair[0])" }
            $text = $text.Replace($pair[0], $pair[1])
          }
          Set-Content $mut $text -NoNewline

          $step = 'dashboard/backend/owner_admin/step_up.py'
          $text = Get-Content $step -Raw
          $old = 'r"^/api/v1/owner/settings/confirm$"'
          $new = 'r"^/api/v1/settings/confirm$"'
          if (($text.Split($old).Count - 1) -ne 1) { throw "Unexpected step_up.py replacement count" }
          Set-Content $step ($text.Replace($old, $new)) -NoNewline

          git diff --check
          git diff -- dashboard/owner-dashboard/authoritative/api.ts dashboard/owner-dashboard/authoritative/mutations.ts dashboard/backend/owner_admin/step_up.py
      - name: Commit exact production fix
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/owner-dashboard/authoritative/api.ts dashboard/owner-dashboard/authoritative/mutations.ts dashboard/backend/owner_admin/step_up.py
          git commit -m "Fix Owner settings wiring and step-up coverage"
          git push origin HEAD:fix/owner-settings-wiring
