name: Temporary Owner Settings Wiring Qualification

on:
  push:
    branches:
      - fix/owner-settings-wiring
    paths:
      - '.github/workflows/tmp-owner-settings-baseline.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: ${{ github.workspace }}
      ALGOFORTIS_TEST_ALLOW_INSECURE_ACL: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/owner-settings-wiring
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/web/package-lock.json
      - name: Versions
        shell: pwsh
        run: |
          python --version
          node --version
          npm --version
      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-runtime.lock.txt
          python -m pip install -r requirements-dashboard.in
          python -m pip install -r requirements-test.in
      - name: Targeted wiring tests
        shell: pwsh
        run: python -m pytest tests_v1/test_owner_user_wiring_contract.py tests_v1/test_owner_admin_step_up_policy.py -q -p no:cacheprovider
      - name: Full Python suite
        shell: pwsh
        run: python -m pytest tests_v1 -q -p no:cacheprovider
      - name: Guard - AI decision intelligence boundary
        shell: pwsh
        run: python build/tools/check_ai_decision_intelligence_boundary.py
      - name: Guard - AI import allowlist
        shell: pwsh
        run: python build/tools/check_ai_import_allowlist.py
      - name: Guard - Phase 8 AI shadow
        shell: pwsh
        run: python build/tools/check_phase8_ai_shadow.py
      - name: Guard - Owner admin boundary
        shell: pwsh
        run: python build/tools/check_owner_admin_boundary.py
      - name: Guard - Phase 7 portfolio risk
        shell: pwsh
        run: python build/tools/check_phase7_portfolio_risk.py
      - name: Guard - S2 account gate
        shell: pwsh
        run: python build/tools/check_s2_account_gate.py
      - name: Frontend install
        working-directory: dashboard/web
        shell: pwsh
        run: npm ci
      - name: Frontend tests
        working-directory: dashboard/web
        shell: pwsh
        run: npx vitest run
      - name: Frontend production build
        working-directory: dashboard/web
        shell: pwsh
        run: npm run build
      - name: Step-up proof
        shell: pwsh
        run: |
          $proof = python -c "from dashboard.backend.owner_admin.step_up import classify_destructive_route as c; print(c('POST','/api/v1/settings/confirm'))"
          Write-Host $proof
          if ($proof.Trim() -ne "('SETTINGS_APPLY', None)") { throw "Step-up proof mismatch: $proof" }
      - name: Scope and forbidden-path proof
        shell: pwsh
        run: |
          $base = '2711d77b4574e85989ea5f56dda1f5fd89c8c40a'
          $changed = @(git diff --name-only "$base...HEAD")
          $allowed = @(
            '.github/workflows/tmp-owner-settings-baseline.yml',
            'dashboard/owner-dashboard/authoritative/api.ts',
            'dashboard/owner-dashboard/authoritative/mutations.ts',
            'dashboard/backend/owner_admin/step_up.py',
            'tests_v1/test_owner_admin_step_up_policy.py',
            'tests_v1/test_owner_user_wiring_contract.py'
          )
          Write-Host 'Changed files:'
          $changed | ForEach-Object { Write-Host $_ }
          $extra = @($changed | Where-Object { $_ -notin $allowed })
          if ($extra.Count -gt 0) { throw "Unexpected changed files: $($extra -join ', ')" }
          $required = @($allowed | Where-Object { $_ -notlike '.github/*' })
          $missing = @($required | Where-Object { $_ -notin $changed })
          if ($missing.Count -gt 0) { throw "Required fix files missing: $($missing -join ', ')" }
          $forbidden = @($changed | Where-Object {
            $_ -like 'engine/live/*' -or
            $_ -like 'engine/risk/*' -or
            $_ -like 'engine/orders/*' -or
            $_ -like 'engine/execution/*' -or
            $_ -like 'engine/broker_adapters/*'
          })
          if ($forbidden.Count -gt 0) { throw "Forbidden paths changed: $($forbidden -join ', ')" }
          Write-Host 'SCOPE_PASS'
          Write-Host 'LIVE_PRESERVATION=NO_FORBIDDEN_PATHS_TOUCHED'
