name: Temporary Owner Settings Wiring RED

on:
  push:
    branches:
      - fix/owner-settings-wiring
    paths:
      - '.github/workflows/tmp-owner-settings-baseline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
      ALGOFORTIS_TEST_ALLOW_INSECURE_ACL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.14"
      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-runtime.lock.txt
          python -m pip install -r requirements-dashboard.in
          python -m pip install -r requirements-test.in
      - name: RED targeted wiring tests
        shell: pwsh
        run: python -m pytest tests_v1/test_owner_user_wiring_contract.py tests_v1/test_owner_admin_step_up_policy.py -q -p no:cacheprovider
