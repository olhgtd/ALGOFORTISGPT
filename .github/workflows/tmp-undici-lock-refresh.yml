name: Temporary Undici Lock Refresh

on:
  push:
    branches:
      - live-v1-v2-reunion-20260930
    paths:
      - .github/workflows/tmp-undici-lock-refresh.yml

permissions:
  contents: read

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/web/package-lock.json
      - name: Refresh vulnerable transitive packages in lock only
        run: npm --prefix dashboard/web audit fix --package-lock-only
      - name: Require high-severity audit clean
        run: npm --prefix dashboard/web audit --audit-level=high
      - name: Show resolved Undici version
        run: node -e "const l=require('./dashboard/web/package-lock.json'); console.log(l.packages['node_modules/undici'])"
      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: patched-package-lock
          path: dashboard/web/package-lock.json
          if-no-files-found: error
