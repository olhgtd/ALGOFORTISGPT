name: Temporary Undici Lock Refresh

on:
  push:
    branches:
      - live-v1-v2-reunion-20260930
    paths:
      - .github/workflows/tmp-undici-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: live-v1-v2-reunion-20260930
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/web/package-lock.json
      - name: Refresh vulnerable transitive packages in lock only
        run: npm --prefix dashboard/web audit fix --package-lock-only
      - name: Require high-severity audit clean
        run: npm --prefix dashboard/web audit --audit-level=high
      - name: Show resolved Undici version
        run: node -e "const l=require('./dashboard/web/package-lock.json'); console.log(l.packages['node_modules/undici'])"
      - name: Commit regenerated lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/web/package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile change required"
          else
            git commit -m "security: refresh vulnerable undici lock"
            git push origin HEAD:live-v1-v2-reunion-20260930
          fi
