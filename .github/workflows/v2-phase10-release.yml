name: V2 Phase 10 Release Qualification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-phase10-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  QUALIFIED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  PYTHONPATH: ${{ github.workspace }}

jobs:
  phase10-focused:
    name: Phase 10 focused / Windows latest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.QUALIFIED_HEAD }}
      - name: Assert exact head
        shell: pwsh
        run: |
          $actual = git rev-parse HEAD
          if ($actual -ne $env:QUALIFIED_HEAD) { throw "Expected $env:QUALIFIED_HEAD but checked out $actual" }
          Write-Host "G10_TESTED_HEAD=$actual"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.14"
      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements-runtime.lock.txt
          python -m pip install -r requirements-dashboard.in
          python -m pip install -r requirements-test.in
      - name: Focused Phase 10 contracts
        shell: pwsh
        run: >-
          python -m pytest
          tests_v1/test_phase10_update_s3.py
          tests_v1/test_phase10_entitlement_telemetry_s3.py
          tests_v1/test_area3_installer_update_lifecycle.py
          tests_v1/test_architectural_foundations.py
          tests_v1/test_phase10_packaging_guard.py
          -q
