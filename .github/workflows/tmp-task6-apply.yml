name: Temporary Apply Task 6 Owner Data

on:
  push:
    branches:
      - feat/owner-full-control-plane

permissions:
  contents: write

jobs:
  apply-task6:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply bounded Task 6 patch
        shell: pwsh
        run: python build/tmp_task6_apply.py
      - name: Commit product changes and remove temporary helpers
        shell: pwsh
        run: |
          git config user.name "AlgoFortis Native Worker"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/tmp-task6-apply.yml build/tmp_task6_apply.py
          git add dashboard/backend/owner_admin/step_up.py dashboard/owner-dashboard/OwnerDashboardApp.tsx
          git diff --check
          git commit -m "feat: centralize Owner data operations"
          git push origin HEAD:feat/owner-full-control-plane
